// ForgeGradle 5+ for Forge 1.12.2 — Mythos Nexus: single-process multi-bot.
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

if (gradle.startParameter.offline) {
    System.setProperty('net.minecraftforge.gradle.check.certs', 'false')
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = 'v0.1'
group = 'com.mythos'
archivesBaseName = 'Mythos-Nexus'
def minecraftVersionSuffix = 'mc-1.12.2'
def releaseJarBaseName = "${archivesBaseName}-${version}-${minecraftVersionSuffix}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

repositories {
    // Mojang's own library host first (text2speech, realms, brigadier...) —
    // bmclapi redirects these to a CDN that fails TLS on this machine.
    maven { url = 'https://libraries.minecraft.net/' }
    // BMCLAPI mirrors the whole Forge maven tree (incl. userdev3 poms); put
    // it before maven.minecraftforge.net so FG doesn't stall on the origin.
    maven { url = 'https://bmclapi2.bangbang93.com/maven/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            mods { mythosnexus { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
}

jar {
    archiveFileName = "${releaseJarBaseName}.jar"
    manifest {
        attributes([
            'Specification-Title'       : 'Mythos-Nexus',
            'Specification-Version'     : version,
            'Implementation-Title'      : 'Mythos-Nexus',
            'Implementation-Version'    : version,
            'FMLCorePlugin'             : 'com.mythos.nexus.core.NexusPlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            'ForceLoadAsMod'            : 'true'
        ])
    }
}
